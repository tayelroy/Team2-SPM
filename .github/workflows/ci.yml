name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every merge retains its own regression run.
  group: ci-${{ github.event.action == 'closed' && format('merged-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  NODE_ENV: test
  SUPABASE_URL: ''
  SUPABASE_ANON_KEY: ''
  SUPABASE_SERVICE_ROLE_KEY: ''

jobs:
  build:
    name: Build applications
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  application-tests:
    name: Test ${{ matrix.name }}
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            workspace: server
          - name: frontend
            workspace: client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run regression tests and enforce 100% coverage
        run: npm run test:coverage --workspace ${{ matrix.workspace }}
      - name: Upload coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-coverage
          path: |
            ${{ matrix.workspace }}/coverage/
            !${{ matrix.workspace }}/coverage/tmp/**
            !${{ matrix.workspace }}/coverage/.tmp/**
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Test browser regression
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys against the real application with isolated storage
        run: npm run test:regression
      - name: Upload browser results and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  database-tests:
    name: Test database policies
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_upgrade:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check role isolation and database constraints
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/auth.sql
          for migration in supabase/migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/checks/release_readiness.sql
          node --test .github/scripts/release-readiness.test.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/account_roles.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/account_multi_roles.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_availability.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_layouts.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_blocks.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_organisation_isolation.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/internal_work_queue.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_planning_and_audit.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_draft_audit.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_preferred_layout.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_registration_settings.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_search.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/registrable_events.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_history_internal_fields.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_clarifications.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_capacity_exceptions.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_holds.sql
          node .github/scripts/test-venue-holds-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_delete_hold_expiry.sql
          node .github/scripts/test-venue-delete-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_booking_requests.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_booking_decisions.sql
          node .github/scripts/test-venue-decisions-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_operations.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipment_records.sql
          node .github/scripts/test-equipment-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/legacy_table_rls.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_double_booking.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipment_requirements.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipment_availability.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipment_reservations.sql
          node .github/scripts/test-equipment-reservations-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipment_release.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_cancellation.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_confirmation.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_change_impact.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_decisions.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_changes_requested.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_approval_gate.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_notifications.sql
          node .github/scripts/test-event-confirmation-concurrency.mjs
          node .github/scripts/test-equipment-requirements-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/event_status_flow.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_temporary_unavailability.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_replacement.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_booking_release.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_booking_change_cancel.sql
          node .github/scripts/test-venue-change-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_setup_turnaround.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_booking_clashes.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_multiple_bookings.sql
          node .github/scripts/test-venue-withdrawal-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_check_queue.sql
          node .github/scripts/test-safety-check-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/notification_inbox_reminders.sql
          node .github/scripts/test-notification-reminders-concurrency.mjs
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/coordinator_oversight.sql
      # SG2-98 AC3: replay the live upgrade on its own database. Blocks written
      # under SG2-45 are seeded just before SG2-80's migration, then the
      # remaining migrations run and the suite checks what survived.
      - name: Check legacy venue blocks and converted hold booking links survive upgrades
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres_upgrade.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/auth.sql
          seeded=false
          holds_seeded=false
          for migration in supabase/migrations/*.sql; do
            if [ "$seeded" = false ] && [[ "$(basename "$migration")" > 202610100001 ]]; then
              docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/legacy_venue_blocks.sql
              seeded=true
            fi
            if [ "$holds_seeded" = false ] && [ "$(basename "$migration")" = 202610170004_venue_hold_booking_links.sql ]; then
              docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/legacy_venue_hold_bookings.sql
              holds_seeded=true
            fi
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
          test "$holds_seeded" = true
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_block_upgrade.sql
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'create table hold_link_upgrade_fixture.after_first as select request_id,xmin::text as row_version from public.venue_booking_requests where request_id between 988402 and 988416'
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/202610170004_venue_hold_booking_links.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/venue_hold_booking_upgrade.sql

      - name: Test APIs against native PostgreSQL through PostgREST
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:integration

  browser-smoke:
    name: Test browser smoke
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Exercise critical roles and request workflow on isolated loopback fixtures
        run: npm run test:smoke
      - name: Upload smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  reviewer-tests:
    name: Test security reviewer
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:reviewer

  build-and-test:
    # Preserve the required check name used by existing branch rules.
    name: Build and test
    needs: [build, application-tests, browser-tests, browser-smoke, database-tests, reviewer-tests]
    if: ${{ always() && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every regression job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success");
            if (failed.length) {
              console.error("Required jobs did not pass:", failed.map(([name, job]) => `${name}: ${job.result}`).join(", "));
              process.exit(1);
            }
          '
      - name: Collect backend coverage
        if: ${{ !cancelled() && needs.build.result == 'success' && needs.application-tests.result == 'success' && needs.browser-tests.result == 'success' && needs.browser-smoke.result == 'success' && needs.database-tests.result == 'success' && needs.reviewer-tests.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage
      - name: Collect frontend coverage
        if: ${{ !cancelled() && needs.build.result == 'success' && needs.application-tests.result == 'success' && needs.browser-tests.result == 'success' && needs.browser-smoke.result == 'success' && needs.database-tests.result == 'success' && needs.reviewer-tests.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage
      - name: Summarize application coverage
        if: ${{ !cancelled() && needs.build.result == 'success' && needs.application-tests.result == 'success' && needs.browser-tests.result == 'success' && needs.browser-smoke.result == 'success' && needs.database-tests.result == 'success' && needs.reviewer-tests.result == 'success' }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined coverage reports
        if: ${{ !cancelled() && needs.build.result == 'success' && needs.application-tests.result == 'success' && needs.browser-tests.result == 'success' && needs.browser-smoke.result == 'success' && needs.database-tests.result == 'success' && needs.reviewer-tests.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          path: |
            server/coverage/
            client/coverage/
          if-no-files-found: error
          retention-days: 14
