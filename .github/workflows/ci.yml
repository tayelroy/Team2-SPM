name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SUPABASE_URL: ''
      SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build applications, test, and enforce coverage
        run: npm run ci
      - name: Summarize application coverage
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          path: |
            server/coverage/
            client/coverage/
            !server/coverage/tmp/**
            !client/coverage/.tmp/**
          if-no-files-found: error
          retention-days: 14
